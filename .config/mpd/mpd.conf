# Шляхи до музики та бази
music_directory    "~/Music"
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.config/mpd/database"
log_file           "~/.config/mpd/log"
pid_file           "~/.config/mpd/pid"
state_file         "~/.config/mpd/state"
sticker_file       "~/.config/mpd/sticker.sql"

# Налаштування мережі (щоб прибрати Connection Refused)
bind_to_address    "127.0.0.1"
port               "6600"
restore_paused     "yes"
auto_update        "yes"

# Вивід звуку через PulseAudio (стандарт для Ubuntu)
audio_output {
    type            "pulse"
    name            "pulse audio"
}

# Налаштування для візуалізатора (спектрограми) в ncmpcpp
audio_output {
    type            "fifo"
    name            "my_fifo"
    path            "/tmp/mpd.fifo"
    format          "44100:16:2"
}
