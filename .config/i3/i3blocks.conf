[updates]
command=$SCRIPT_DIR/i3blocks-updates
label= 
interval=1800
color=#00ff00

[weather]
command=$SCRIPT_DIR/i3-weather
interval=1800
signal=10

[notifications]
command=$SCRIPT_DIR/i3blocks-notif
markup=pango
interval=10
signal=10

[memory]
command=$SCRIPT_DIR/memory
label=󰍛
interval=5

[temperature]
command=$SCRIPT_DIR/i3blocks-temperature
label= 
interval=10
color=#ffffff
#T_WARN=95
#T_CRIT=97
#SENSOR_CHIP=""

[wifi]
command=$SCRIPT_DIR/wifi
label= 
#INTERFACE=wlp3s0
interval=5
#click=$HOME/.local/bin/i3block-rofi-wifi.sh

[kbdd_layout]
command=$SCRIPT_DIR/kbdd_layout
label= 
interval=persist

[time]
command=$SCRIPT_DIR/i3blocks-time
label=
interval=1

[date]
command=$SCRIPT_DIR/i3blocks-date
label=
interval=1

[inverter]
command=$HOME/.config/i3/scripts/inverter
markup=pango
interval=60

[battery2]
command=$HOME/.config/i3/scripts/battery_upower
markup=pango
interval=10

[battery-plus]
command=$SCRIPT_DIR/battery-plus
markup=pango
instance=BAT0
interval=30
#_FONT=FontAwesome
#_PERCENT=&#x25;
#_HIDE_IF_CHARGED=false
#_HIDE_OVER_PERCENTAGE=80
#_USE_BATT_GRADIENT=false
#_SYMBOLS_ONLY=false
#_HIDE_PERCENTAGE=false
#_HIDE_TIME_REMAINING=true
#_HIDE_TIME_TO_FULL=true
#_SHOW_CHARGE_DIRECTION=true
#_CAPACITY_ALERT=75
#_CRITICAL_ACTION=notify
#_LOW_ACTION=notify
#_NOTIFY_PROGRAM=notify-send
#_NOTIFY_EXPIRES=1500
#_NOTIFY_THROTTLE=120
#_COLOR_FULLY_CHARGED=
